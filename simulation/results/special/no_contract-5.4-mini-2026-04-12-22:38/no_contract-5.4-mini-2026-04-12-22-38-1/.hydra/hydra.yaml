hydra:
  run:
    dir: ./outputs/${uuid:}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath:
  - ./simulation/scenarios/fishing/conf
  - ./simulation/scenarios/sheep/conf
  - ./simulation/scenarios/pollution/conf
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - experiment=fish_iid_stochastic_no_contract
    - group_name=no_contract-5.4-mini-2026-04-12-22:38
    - llm.path=openai/gpt-5.4-mini
    - experiment.env.regen_factor_range=[2.0,2.0]
    - llm.backend=OpenAI
    - seed=3
    - experiment.env.regen_seed=3
  job:
    name: main
    chdir: null
    override_dirname: experiment.env.regen_factor_range=[2.0,2.0],experiment.env.regen_seed=3,experiment=fish_iid_stochastic_no_contract,group_name=no_contract-5.4-mini-2026-04-12-22:38,llm.backend=OpenAI,llm.path=openai/gpt-5.4-mini,seed=3
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/angeloh/Desktop/work/GovSimElect
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/angeloh/Desktop/work/GovSimElect/simulation/conf
      schema: file
      provider: main
    - path: ./simulation/scenarios/fishing/conf
      schema: file
      provider: hydra.searchpath in main
    - path: ./simulation/scenarios/sheep/conf
      schema: file
      provider: hydra.searchpath in main
    - path: ./simulation/scenarios/pollution/conf
      schema: file
      provider: hydra.searchpath in main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/angeloh/Desktop/work/GovSimElect/outputs/run_bd84f843-d1b5-43ff-98f4-788fa339795e
    choices:
      experiment: fish_iid_stochastic_no_contract
      experiment/persona@experiment.personas.persona_4: selfish_fisherman
      experiment/persona@experiment.personas.persona_3: selfish_fisherman
      experiment/persona@experiment.personas.persona_2: selfish_fisherman
      experiment/persona@experiment.personas.persona_1: selfish_fisherman
      experiment/persona@experiment.personas.persona_0: selfish_fisherman
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
